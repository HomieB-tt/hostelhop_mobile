name: hostelhop_mobile
description: "HostelHop — Campus Life, Sorted. Student mobile app for browsing, booking, and paying for hostels in Uganda."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # UI
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  smooth_page_indicator: ^1.2.0+3
  cached_network_image: ^3.4.1

  # State
  provider: ^6.1.2

  # Backend (Phase 2 — stubbed for now)
  supabase_flutter: ^2.8.3

  # Utils
  shared_preferences: ^2.3.4
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
