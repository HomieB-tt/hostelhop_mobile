name: hostelhop_mobile
description: "HostelHop — Campus Life, Sorted. Student mobile app for browsing, booking, and paying for hostels in Uganda."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # UI
  google_fonts: ^8.1.0
  flutter_animate: ^4.5.2
  smooth_page_indicator: ^2.0.1
  cached_network_image: ^3.4.1

  # State Management
  provider: ^6.1.2
  riverpod: ^3.2.1
  flutter_riverpod: ^3.3.1

  # Routing
  go_router: ^17.2.3

  # Backend
  supabase_flutter: ^2.8.3
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0

  # Location & Maps
  google_maps_flutter: ^2.5.0
  google_places_flutter: ^2.0.6
  geolocator: ^14.0.2
  http: ^1.1.0

  # Image Handling
  image_picker: ^1.0.0
  flutter_image_compress: ^2.1.0

  # Connectivity
  connectivity_plus: ^6.0.3

  # Utils
  shared_preferences: ^2.3.4
  intl: ^0.20.2

  # Notifications
  flutter_local_notifications: ^21.0.0
  flutter_dotenv: ^6.0.1
  state_notifier: ^1.0.0
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - .env

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
